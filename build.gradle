plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'com.epages.restdocs-api-spec' version '0.20.1'
	id 'org.jooq.jooq-codegen-gradle' version '3.21.7'
	id 'com.diffplug.spotless' version '8.10.0' apply false
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

apply from: 'lint.gradle'

def snippetsDirectory = layout.buildDirectory.dir('generated-snippets')
def apiDocumentsDirectory = layout.buildDirectory.dir('generated-api-docs')

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	jooqCodegen 'org.jooq:jooq-meta-extensions'

	// JJWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'

	// Micrometer
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Swagger UI
	runtimeOnly 'org.webjars:swagger-ui:5.32.2'

	// Spring Boot Test and REST Docs
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'

	// Instancio
	testImplementation 'org.instancio:instancio-junit:6.0.0'

	// Testcontainers
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
	testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
}

jooq {
	configuration {
		generator {
			database {
				name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
				properties {
					property {
						key = 'scripts'
						value = 'src/main/resources/db/migration/*.sql'
					}
					property {
						key = 'sort'
						value = 'flyway'
					}
					property {
						key = 'defaultNameCase'
						value = 'lower'
					}
				}
			}
			generate {
				deprecated = false
				pojos = false
			}
			target {
				packageName = 'com.example.lab.generated.jooq'
				directory = layout.buildDirectory.dir('generated-src/jooq/main').get().asFile.path
			}
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('jooqCodegen')
}

tasks.named('bootRun') {
	dependsOn 'copyApiDocs'
	classpath += files(apiDocumentsDirectory)
	systemProperty 'spring.profiles.active', 'local'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	outputs.dir snippetsDirectory
}

tasks.named('asciidoctor') {
	dependsOn tasks.named('test')
	attributes 'snippets': snippetsDirectory.get().asFile
}

openapi3 {
	server = 'http://localhost:8080'
	title = 'Spring Example Template API'
	description = 'Spring Example Template API documentation'
	version = project.version
	format = 'yaml'
}

tasks.configureEach {
	if (name == 'openapi3') {
		dependsOn tasks.named('test')
	}
}

tasks.register('copyApiDocs', Copy) {
	dependsOn tasks.named('asciidoctor')
	dependsOn 'openapi3'

	from(layout.buildDirectory.dir('docs/asciidoc')) {
		include 'index.html'
	}
	from(layout.buildDirectory.dir('api-spec')) {
		include 'openapi3.yaml'
	}
	into apiDocumentsDirectory.map { it.dir('static/docs') }
}

tasks.named('bootJar') {
	dependsOn tasks.named('copyApiDocs')
}
