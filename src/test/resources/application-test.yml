spring:
  application:
    name: spring-example-template
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://invalid:5432/invalid
    username: invalid
    password: invalid
  flyway:
    enabled: false
  data:
    redis:
      host: invalid
      port: 1
      connect-timeout: 1s
      timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

user:
  withdrawn-account-cleanup-cron: "0 0 3 * * *"

security:
  auth:
    access-token-ttl: 15m
    standard-refresh-ttl: 14d
    remember-me-refresh-ttl: 30d
    refresh-token-cookie-name: refresh-token
    secure-cookies: false
    csrf-cookie-domain: ""
    allowed-origins:
      - http://localhost:3000
  jwt:
    secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    issuer: spring-example-template
    audience: spring-example-template-api
    access-token-cookie-name: access-token
    allowed-clock-skew: 30s

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:}
