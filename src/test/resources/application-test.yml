spring:
  application:
    name: spring-example-template
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

security:
  auth:
    access-token-ttl: 15m
    standard-refresh-ttl: 14d
    remember-me-refresh-ttl: 30d
    refresh-token-cookie-name: refresh-token
    secure-cookies: false
    csrf-cookie-domain: ""
    allowed-origins:
      - http://localhost:3000
  jwt:
    secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    issuer: spring-example-template
    audience: spring-example-template-api
    access-token-cookie-name: access-token
    allowed-clock-skew: 30s
