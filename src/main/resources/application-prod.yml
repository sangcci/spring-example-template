spring:
  application:
    name: spring-example-template
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 1s
      timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

user:
  withdrawn-account-cleanup-cron: "${WITHDRAWN_ACCOUNT_CLEANUP_CRON:0 0 3 * * *}"

security:
  auth:
    access-token-ttl: 15m
    standard-refresh-ttl: 14d
    remember-me-refresh-ttl: 30d
    refresh-token-cookie-name: refresh-token
    secure-cookies: true
    csrf-cookie-domain: ${CSRF_COOKIE_DOMAIN}
    allowed-origins:
      - ${FRONTEND_ORIGIN}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: spring-example-template
    audience: spring-example-template-api
    access-token-cookie-name: access-token
    allowed-clock-skew: 30s

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:logstash}
