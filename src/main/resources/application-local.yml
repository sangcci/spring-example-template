spring:
  application:
    name: spring-example-template
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_example}
    username: ${DB_USERNAME:spring_example}
    password: ${DB_PASSWORD:spring_example}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

security:
  auth:
    access-token-ttl: 15m
    standard-refresh-ttl: 14d
    remember-me-refresh-ttl: 30d
    refresh-token-cookie-name: refresh-token
    secure-cookies: false
    csrf-cookie-domain: ${CSRF_COOKIE_DOMAIN:}
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: spring-example-template
    audience: spring-example-template-api
    access-token-cookie-name: access-token
    allowed-clock-skew: 30s
